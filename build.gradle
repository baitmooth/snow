buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com' }
    }

    rootProject.ext {
        MinSdk = 21
        TargetSdk = 36
        CompileSdk = 36
        CandyBarVersion = '3.23.0'
        versionCode = 8
        versionName = '1.4.6'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
    delete fileTree(dir: 'app/src/main/res/drawable-anydpi')
}